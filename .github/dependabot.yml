version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: "nuget"
    directory: "/"
    labels:
      - "dependencies"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30

  # Docs dependencies are not worth tracking, this entry only exists to suppress security update PRs
  - package-ecosystem: "npm"
    directory: "/docs"
    labels:
      - "dependencies"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
