name: Release Build

permissions:
  contents: read

on:
  push:
    tags:
    - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SKIP_ANALYSIS: -p:RunAnalyzersDuringBuild=false
  PUBLISH_ARGS: -p:PublishReadyToRun=true

jobs:
  cli:
    name: CLI (${{ matrix.rid }})

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          rid: win-x64
          artifact: cli-windows-x64
        - os: ubuntu-latest
          rid: linux-x64
          artifact: cli-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Publish CLI
      run: dotnet publish --configuration Release --self-contained --runtime ${{ matrix.rid }} ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} CLI/CLI.csproj

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: |
          CLI/bin/Release/${{ matrix.rid }}/publish
          !**/*.pdb

  gui:
    name: GUI (win-x64)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Publish GUI
      run: dotnet publish --configuration Release --self-contained --runtime win-x64 ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} GUI/GUI.csproj

    - name: Upload GUI artifact
      uses: actions/upload-artifact@v7
      with:
        name: gui-windows-x64
        path: |
          GUI/bin/Release/win-x64/publish
          !**/*.pdb

  release:
    name: Create release
    needs: [cli, gui]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Create release archives
      run: |
        set -eux
        mkdir release
        chmod +x artifacts/cli-linux-x64/Source2Viewer-CLI
        zip -9j release/cli-windows-x64.zip artifacts/cli-windows-x64/*
        zip -9j release/cli-linux-x64.zip artifacts/cli-linux-x64/*
        zip -9j release/gui-windows-x64.zip artifacts/gui-windows-x64/*

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
