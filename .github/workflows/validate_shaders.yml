name: Validate Shaders

on:
  workflow_dispatch:
  push:
    paths:
      - Renderer/Shaders/**
      - Renderer/Renderer/ShaderLoader.Validator.cs
      - Renderer/Renderer/ShaderLoader.cs
      - Renderer/Renderer/ShaderParser.cs
  pull_request:
    paths:
      - Renderer/Shaders/**
      - Renderer/Renderer/ShaderLoader.Validator.cs
      - Renderer/Renderer/ShaderLoader.cs
      - Renderer/Renderer/ShaderParser.cs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      MESA_GLSL_VERSION_OVERRIDE: '460'
      MESA_GL_VERSION_OVERRIDE: '4.6'
      GALLIUM_DRIVER: 'llvmpipe'

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Validate
      shell: bash
      run: |
        set +e
        xvfb-run -a -s "-screen 0 1280x1024x24" dotnet run --project Misc/ShaderValidator 2>&1 | tee validator.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          # Logs need a signed in account, annotations do not
          echo "::error title=Shader validator exited with $status::$(tail -n 25 validator.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')"
        fi
        exit "$status"

  # Temporary: bisects the llvmpipe crash in particle_spritecard. Annotations report each experiment.
  spritecard-experiments:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        experiment: [current, pre_motion_vectors, no_motion_loop, no_continue, no_layer_uvs, old_distort, no_flow, softpipe]

    env:
      MESA_GLSL_VERSION_OVERRIDE: '460'
      MESA_GL_VERSION_OVERRIDE: '4.6'
      GALLIUM_DRIVER: ${{ matrix.experiment == 'softpipe' && 'softpipe' || 'llvmpipe' }}
      EXPERIMENT: ${{ matrix.experiment }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Patch shader
      shell: python
      run: |
        import os, pathlib, subprocess, sys
        exp = os.environ["EXPERIMENT"]
        path = pathlib.Path("Renderer/Shaders/particle_spritecard.frag.slang")
        text = path.read_text()

        def replace(old, new):
            global text
            if old not in text:
                sys.exit(f"{exp}: pattern not found: {old!r}")
            text = text.replace(old, new)

        if exp == "pre_motion_vectors":
            text = subprocess.run(["git", "show", "9542fb9fa^:Renderer/Shaders/particle_spritecard.frag.slang"], capture_output=True, text=True, check=True).stdout
        elif exp == "no_motion_loop":
            start = text.index("#if S_TEXTURE_LAYERS > 0\n    // Layer 0 is always a colour layer")
            end = text.index("#endif\n", start) + len("#endif\n")
            text = text[:start] + text[end:]
        elif exp == "no_continue":
            replace("        if (effectMode == SPRITECARD_TEXTURE_ANIMMOTIONVEC)\n        {\n            continue;\n        }\n", "")
        elif exp == "no_layer_uvs":
            replace("vec4 uvs = LayerUvs(i);", "vec4 uvs = vec4(vTexCoordOut, vTexCoordNextFrameOut);")
            replace("vec4 motionUvs = LayerUvs(i);", "vec4 motionUvs = vec4(vTexCoordOut, vTexCoordNextFrameOut);")
        elif exp == "old_distort":
            replace("DistortPrevious(previousLayer,", "DistortPrevious(max(i - 1, 0),")
        elif exp == "no_flow":
            replace("        if (colourLayers < 2)\n        {\n            layerUv -= flow;\n            layerUvNext += flowNext;\n        }\n", "")

        path.write_text(text)
        print(f"{exp}: patched")

    - name: Validate particle_spritecard
      shell: bash
      run: |
        set +e
        xvfb-run -a -s "-screen 0 1280x1024x24" dotnet run --project Misc/ShaderValidator -- particle_spritecard 2>&1 | tee validator.log
        status=${PIPESTATUS[0]}
        echo "::notice title=${EXPERIMENT} exited with ${status}::$(tail -n 12 validator.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')"
        exit 0
