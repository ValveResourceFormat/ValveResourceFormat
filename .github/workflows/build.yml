name: CI

permissions:
  actions: write
  contents: write
  id-token: write

on:
  push:
    branches:
    - master
    tags:
    - '*'
    paths-ignore:
    - '.github/*_TEMPLATE/**'
    - 'docs/**'
    - '*.md'
  pull_request:
    paths-ignore:
    - '.github/*_TEMPLATE/**'
    - 'docs/**'
    - '*.md'
  workflow_dispatch:
  schedule:
  - cron: "37 10 * * 2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/master' }}

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  SKIP_ANALYSIS: -p:RunAnalyzersDuringBuild=false
  PUBLISH_ARGS: -p:PublishReadyToRun=${{ github.ref_type == 'tag' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
        include:
        - os: ubuntu-latest
          coverage: --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Run tests
      run: dotnet test --project ./Tests/Tests.csproj --configuration Release --minimum-expected-tests 400 ${{ env.SKIP_ANALYSIS }} ${{ matrix.coverage }}

#    - name: Check formatting
#      if: matrix.os == 'ubuntu-latest'
#      run: dotnet format --verify-no-changes

    - name: Pack nupkg
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack --configuration Release ${{ env.SKIP_ANALYSIS }} ValveResourceFormat/ValveResourceFormat.csproj

    - name: Pack renderer nupkg
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack --configuration Release ${{ env.SKIP_ANALYSIS }} Renderer/Renderer.csproj

    - name: Publish CLI (Windows x64)
      if: matrix.os == 'windows-latest'
      run: dotnet publish --configuration Release --self-contained --runtime win-x64 ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} CLI/CLI.csproj

    - name: Publish CLI (Windows arm64)
      if: matrix.os == 'windows-11-arm'
      run: dotnet publish --configuration Release --self-contained --runtime win-arm64 ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} CLI/CLI.csproj

    - name: Publish CLI (Linux x64)
      if: matrix.os == 'ubuntu-latest'
      run: dotnet publish --configuration Release --self-contained --runtime linux-x64 ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} CLI/CLI.csproj

    - name: Publish CLI (Linux arm)
      if: matrix.os == 'ubuntu-24.04-arm'
      run: dotnet publish --configuration Release --self-contained --runtime linux-arm ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} CLI/CLI.csproj

    - name: Publish CLI (Linux arm64)
      if: matrix.os == 'ubuntu-24.04-arm'
      run: dotnet publish --configuration Release --self-contained --runtime linux-arm64 ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} CLI/CLI.csproj

    - name: Publish CLI (macOS x64)
      if: matrix.os == 'macos-latest'
      run: dotnet publish --configuration Release --self-contained --runtime osx-x64 ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} CLI/CLI.csproj

    - name: Publish CLI (macOS arm64)
      if: matrix.os == 'macos-latest'
      run: dotnet publish --configuration Release --self-contained --runtime osx-arm64 ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} CLI/CLI.csproj

    - name: Build misc projects
      if: matrix.os == 'ubuntu-24.04-arm'
      run: dotnet build Misc/MiscVrfProjects.slnx

    - name: Upload nupkg
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: nupkg
        path: 'ValveResourceFormat/bin/Release/*.nupkg'

    - name: Upload renderer nupkg
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: renderer-nupkg
        path: 'Renderer/bin/Release/*.nupkg'

    - name: Upload CLI (Windows x64)
      uses: actions/upload-artifact@v7
      if: matrix.os == 'windows-latest'
      with:
        name: cli-windows-x64
        path: |
          CLI/bin/Release/win-x64/publish
          !**/*.pdb

    - name: Upload CLI (Windows arm64)
      uses: actions/upload-artifact@v7
      if: matrix.os == 'windows-11-arm'
      with:
        name: cli-windows-arm64
        path: |
          CLI/bin/Release/win-arm64/publish
          !**/*.pdb

    - name: Upload CLI (Linux x64)
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: cli-linux-x64
        path: |
          CLI/bin/Release/linux-x64/publish
          !**/*.pdb

    - name: Upload CLI (Linux arm)
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-24.04-arm'
      with:
        name: cli-linux-arm
        path: |
          CLI/bin/Release/linux-arm/publish
          !**/*.pdb

    - name: Upload CLI (Linux arm64)
      uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-24.04-arm'
      with:
        name: cli-linux-arm64
        path: |
          CLI/bin/Release/linux-arm64/publish
          !**/*.pdb

    - name: Upload CLI (macOS x64)
      uses: actions/upload-artifact@v7
      if: matrix.os == 'macos-latest'
      with:
        name: cli-macos-x64
        path: |
          CLI/bin/Release/osx-x64/publish
          !**/*.pdb

    - name: Upload CLI (macOS arm64)
      uses: actions/upload-artifact@v7
      if: matrix.os == 'macos-latest'
      with:
        name: cli-macos-arm64
        path: |
          CLI/bin/Release/osx-arm64/publish
          !**/*.pdb

    - name: Upload test coverage
      uses: codecov/codecov-action@v7
      if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/master'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./TestResults/coverage.cobertura.xml
        fail_ci_if_error: true
        verbose: true

  source2viewer-rel:
    name: Source2Viewer (win-x64)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Publish
      run: dotnet publish --configuration Release --self-contained --runtime win-x64 ${{ env.SKIP_ANALYSIS }} ${{ env.PUBLISH_ARGS }} GUI/GUI.csproj

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        #archive: false # https://github.com/oprypin/nightly.link/issues/88
        name: Source2Viewer
        path: 'GUI/bin/Release/win-x64/publish/*.exe'
        compression-level: 0

  analyze:
    name: Run all analyzers
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/setup-dotnet-cache

    - name: Build
      run: dotnet build --configuration Release ValveResourceFormat.slnx

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, analyze, source2viewer-rel]
    runs-on: ubuntu-latest

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Display artifacts folder structure
      run: find .
      working-directory: artifacts

    - name: Upload binaries to be signed
      id: signpath-artifact
      uses: actions/upload-artifact@v7
      with:
        name: signpath-to-be-signed
        retention-days: 1
        # If the folder or executable names change, login to signpath
        # and modify the "Artifact Configurations" there, as it specifies the paths
        path: |
          artifacts/Source2Viewer/
          artifacts/cli-windows-x64/
          artifacts/cli-windows-arm64/

    - name: Sign the binaries
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: '4ff8c8f4-926e-4ee5-8886-7899212bb76e'
        github-artifact-id: '${{ steps.signpath-artifact.outputs.artifact-id }}'
        project-slug: 'ValveResourceFormat'
        signing-policy-slug: 'release-signing'
        output-artifact-directory: 'signed'
        wait-for-completion: true

    - name: Display signed folder structure
      run: find .
      working-directory: signed

    - name: Create release files
      run: |
       set -eux
       mkdir release
       chmod +x artifacts/cli-linux-x64/Source2Viewer-CLI
       chmod +x artifacts/cli-linux-arm/Source2Viewer-CLI
       chmod +x artifacts/cli-linux-arm64/Source2Viewer-CLI
       chmod +x artifacts/cli-macos-x64/Source2Viewer-CLI
       chmod +x artifacts/cli-macos-arm64/Source2Viewer-CLI
       zip -9j release/cli-windows-x64.zip signed/cli-windows-x64/*
       zip -9j release/cli-windows-arm64.zip signed/cli-windows-arm64/*
       zip -9j release/cli-linux-x64.zip artifacts/cli-linux-x64/*
       zip -9j release/cli-linux-arm.zip artifacts/cli-linux-arm/*
       zip -9j release/cli-linux-arm64.zip artifacts/cli-linux-arm64/*
       zip -9j release/cli-macos-x64.zip artifacts/cli-macos-x64/*
       zip -9j release/cli-macos-arm64.zip artifacts/cli-macos-arm64/*
       mv signed/Source2Viewer/Source2Viewer.exe release/
       mv artifacts/nupkg/ValveResourceFormat.*.nupkg release/ValveResourceFormat.nupkg
       mv artifacts/renderer-nupkg/ValveResourceFormat.Renderer.*.nupkg release/ValveResourceFormat.Renderer.nupkg

    - name: Display structure of archived files
      run: ls -Rl
      working-directory: release

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish to NuGet Gallery
      run: dotnet nuget push release/ValveResourceFormat.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json"

    - name: Publish renderer to NuGet Gallery
      run: dotnet nuget push release/ValveResourceFormat.Renderer.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source "https://api.nuget.org/v3/index.json"
