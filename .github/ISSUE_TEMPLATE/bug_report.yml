name: Bug Report
description: File a bug report
labels: [Bug]
type: 'Bug'
body:
- type: input
  id: version
  attributes:
    label: What version of S2V are you using?
    description: |
      # **Test on the [latest dev build](https://s2v.app/dev/) first, not a release.**
    placeholder: Use the copy version button in the about window
  validations:
    required: true

- type: textarea
  id: description
  attributes:
    label: Describe the bug
    description: What happened, and what did you expect to happen instead?
  validations:
    required: true

- type: textarea
  id: file
  attributes:
    label: Game and file
    description: The game and the path to the file that causes this behavior. If this happens in a workshop item, include a link to the workshop.
    placeholder: "Counter-Strike 2, maps/de_dust2.vpk"
  validations:
    required: true

- type: textarea
  id: logs
  attributes:
    label: Relevant log output or exception with stacktrace
    description: "Copy and paste any relevant log output. *This will be automatically formatted into code, backticks are not needed.*"
    placeholder: "System.IndexOutOfRangeException: Index was outside the bounds of the array…"
    render: shell
